name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    # Fail fast instead of letting a wedged step occupy the runner until it
    # loses communication with the server.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Build before testing: tests/cli/version.test.ts executes the packaged
      # bundle from dist/, and dist/ is not part of the checkout.
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:reliability
      - name: Test (Windows, excluding POSIX signal/process contract)
        if: runner.os == 'Windows'
        run: npm test -- --exclude tests/cli/sigint-process.test.ts
      - name: Test (POSIX, including signal/process contract)
        if: runner.os != 'Windows'
        run: npm test
      - run: npm run smoke:install
